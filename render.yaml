databases:
  - name: job-tracker-db
    databaseName: job_tracker
    user: job_tracker

services:
  - type: web
    name: job-tracker-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn config.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: job-tracker-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://job-tracker.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://job-tracker.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: job-tracker-db
          property: connectionString
      - key: DB_SSL_REQUIRE
        value: "True"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
